# Put this file into <projects folder>/dockit/compose.yaml (e.g. /opt/stacks/dockit)
# so that Dockit shows up as a project in itself and can update itself.
# Settings go into a .env file next to it, see .env.example.
x-dockit:
  description: Docker compose manager

services:
  dockit:
    image: bztes/vibes-dockit:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - '3000:3000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # IMPORTANT: mount the projects folder with the *same* path as on the host,
      # relative bind mounts in your compose files are resolved by the host daemon.
      - ${PROJECTS_ROOT:?set PROJECTS_ROOT in .env}:${PROJECTS_ROOT}
      - ./data:/data
